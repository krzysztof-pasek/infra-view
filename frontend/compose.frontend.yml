services:
  frontend:
    image: infra-view-frontend:local
    container_name: INFRA_VIEW_FRONTEND
    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:8080"

    environment:
      BACKEND_URL: "http://host.docker.internal:8080"

    extra_hosts:
      - "host.docker.internal:host-gateway"